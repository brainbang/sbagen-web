        <button id="playBtn">▶ Play (Infinite)</button>

        <span id="timeDisplay" style="margin-left: 10px"></span>

      <pre id="output"></pre>

    <script type="module">
      // Import the WASM module
      import createSBaGenModule from "./sbagen/sbagen.mjs";

      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");
      const fileInput = document.getElementById("fileInput");
      const exampleSelect = document.getElementById("exampleSelect");
      const playControls = document.getElementById("playControls");
      const playBtn = document.getElementById("playBtn");
      const stopBtn = document.getElementById("stopBtn");
      const timeDisplay = document.getElementById("timeDisplay");

      let Module;
      let output = "";
      let currentFile = null;
      let audioContext = null;
      let audioWorkletNode = null;
      let isPlaying = false;

      function captureOutput(text) {
        output += text + "\n";
        outputEl.textContent = output;
      }

      try {
        // Initialize the module
        Module = await createSBaGenModule({
          print: captureOutput,
          printErr: captureOutput,
          noInitialRun: true,
        });

        // Ensure FS is available
        if (!Module.FS) {
          throw new Error("Filesystem not available in module");
        }

        statusEl.removeAttribute("aria-busy");
        statusEl.textContent = "Ready - choose an example or load your own file";
        fileInput.disabled = false;
        exampleSelect.disabled = false;

        // Shared function to load and process a file
        async function loadSequenceFile(filename, arrayBuffer) {
          try {
            // Clear any previous errors
            statusEl.removeAttribute("aria-busy");
            statusEl.innerHTML = "";

            // Stop current playback if playing
            if (isPlaying) {
              isPlaying = false;
              if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({ type: "stop" });
                audioWorkletNode.disconnect();
                audioWorkletNode = null;
              }
              playBtn.style.display = "inline-block";
              stopBtn.style.display = "none";
              timeDisplay.textContent = "";
            }

            // Reset audio buffer for new file
            audioBuffer = null;

            output = "";
            outputEl.textContent = "Loading and validating file...\n";

            const uint8Array = new Uint8Array(arrayBuffer);

            // Write file to Emscripten virtual filesystem
            // Delete if exists first
            try {
              Module.FS.unlink(`/${filename}`);
            } catch (e) {
              // File doesn't exist, that's fine
            }
            Module.FS.writeFile(`/${filename}`, uint8Array);
            currentFile = filename;

            // Show the file contents in output
            const text = new TextDecoder().decode(uint8Array);
            outputEl.textContent = text;

            // Parse for .ogg file references and load them
            try {
              const oggMatches = text.match(/[\w\-]+\.ogg/g);
              if (oggMatches) {
                const uniqueOggs = [...new Set(oggMatches)];
                for (const oggFile of uniqueOggs) {
                  try {
                    const oggResponse = await fetch(`examples/${oggFile}`);
                    if (oggResponse.ok) {
                      const oggData = await oggResponse.arrayBuffer();
                      Module.FS.writeFile(`/${oggFile}`, new Uint8Array(oggData));
                    }
                  } catch (err) {
                    // Ignore individual .ogg file errors
                  }
                }
              }
            } catch (err) {
              // Ignore .ogg parsing errors
            }

            // Initialize audio context and load worklet
            if (!audioContext) {
              audioContext = new AudioContext();
              try {
                await audioContext.audioWorklet.addModule("audio-processor.js");
              } catch (err) {
                statusEl.innerHTML = `<mark>Failed to load audio processor: ${err.message}</mark>`;
                return;
              }
            }

            // Show play controls
            playControls.style.display = "block";
          } catch (error) {
            // Extract useful error information
            let errorMsg = "Unknown error";
            let errorDetails = "";

            if (error) {
              if (error.message) {
                errorMsg = error.message;
              } else if (typeof error === "string") {
                errorMsg = error;
              } else if (error.toString && error.toString() !== "[object Object]") {
                errorMsg = error.toString();
              }

              if (error.stack) {
                errorDetails = error.stack;
              } else {
                try {
                  errorDetails = JSON.stringify(error, null, 2);
                } catch (e) {
                  errorDetails = String(error);
                }
              }
            }

            statusEl.innerHTML = `<mark>Error loading file: ${errorMsg}</mark>`;
            output = `Error: ${errorMsg}\n\n${errorDetails}\n`;
            outputEl.textContent = output;
          }
        }

        // Example select handler
        exampleSelect.addEventListener("change", async (e) => {
          const examplePath = e.target.value;
          if (!examplePath) return;

          try {
            const response = await fetch(examplePath);
            if (!response.ok) {
              throw new Error(`Failed to load example: ${response.statusText}`);
            }
            const arrayBuffer = await response.arrayBuffer();
            const filename = examplePath.split("/").pop();
            await loadSequenceFile(filename, arrayBuffer);
          } catch (error) {
            let errorMsg = "Unknown error";
            if (error?.message) errorMsg = error.message;
            else if (typeof error === "string") errorMsg = error;

            statusEl.innerHTML = `<mark>Error loading example: ${errorMsg}</mark>`;
            outputEl.textContent = `Error: ${errorMsg}\n${error?.stack || ""}`;
          }
        });

        // File input handler
        fileInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const arrayBuffer = await file.arrayBuffer();
          await loadSequenceFile(file.name, arrayBuffer);
        });

        let audioBuffer = null;

        // Generate a long audio buffer to loop
        async function generateAudioBuffer() {
          // Capture sbagen output for debugging
          let sbagenOutput = "";

          // Create a fresh module instance
          const tempModule = await createSBaGenModule({
            print: (text) => { sbagenOutput += text + "\n"; },
            printErr: (text) => { sbagenOutput += "ERROR: " + text + "\n"; },
            noInitialRun: true,
          });

          // Copy the sequence file
          const fileData = Module.FS.readFile(`/${currentFile}`);
          tempModule.FS.writeFile(`/${currentFile}`, fileData);

          // Copy any .ogg files from main module to temp module
          try {
            const files = Module.FS.readdir('/');
            for (const file of files) {
              if (file && typeof file === 'string' && file.endsWith('.ogg')) {
                try {
                  const stat = Module.FS.stat(`/${file}`);
                  if (Module.FS.isFile(stat.mode)) {
                    const oggData = Module.FS.readFile(`/${file}`);
                    tempModule.FS.writeFile(`/${file}`, oggData);
                  }
                } catch (err) {
                  // Skip this file
                }
              }
            }
          } catch (e) {
            // Ignore if no .ogg files
          }

          try {
            // Generate 5 minutes from the start
            tempModule.callMain([
              "-o",
              "/audio.raw",
              "-S",
              "-L",
              "00:05:00",
              `/${currentFile}`,
            ]);
          } catch (e) {
            // Exit is normal for sbagen
          }

          // Check if audio was generated
          let audioFileExists = false;
          let audioFileSize = 0;

          try {
            const stat = tempModule.FS.stat("/audio.raw");
            audioFileExists = true;
            audioFileSize = stat.size;
          } catch (e) {
            // File doesn't exist
          }

          if (!audioFileExists || audioFileSize === 0) {
            let errorMsg = "SBaGen failed to generate audio.";
            if (sbagenOutput.trim()) {
              errorMsg += "\n\nSBaGen output:\n" + sbagenOutput;
            }
            if (!audioFileExists) {
              errorMsg += "\n\nThe audio file was not created. This usually means the sequence file has errors or references unsupported features (like OGG files without OGG support compiled in).";
            } else {
              errorMsg += "\n\nThe audio file is empty.";
            }
            throw new Error(errorMsg);
          }

          // Read and convert
          const rawData = tempModule.FS.readFile("/audio.raw");

          const samples = new Int16Array(
            rawData.buffer,
            rawData.byteOffset,
            rawData.byteLength / 2,
          );

          // Convert to float32 (interleaved stereo)
          const floatSamples = new Float32Array(samples.length);
          for (let i = 0; i < samples.length; i++) {
            floatSamples[i] = samples[i] / 32768.0;
          }

          return floatSamples;
        }

        // Play button handler - generate once and loop
        playBtn.addEventListener("click", async () => {
          if (!currentFile || isPlaying) return;

          try {
            playBtn.disabled = true;
            playBtn.textContent = "⏳ Generating...";

            // Resume audio context if suspended
            if (audioContext.state === "suspended") {
              await audioContext.resume();
            }

            // Generate 5-minute buffer
            if (!audioBuffer) {
              audioBuffer = await generateAudioBuffer();
            }

            // Create worklet node with stereo output
            audioWorkletNode = new AudioWorkletNode(
              audioContext,
              "sbagen-processor",
              {
                numberOfInputs: 0,
                numberOfOutputs: 1,
                outputChannelCount: [2],
              },
            );
            audioWorkletNode.connect(audioContext.destination);

            // Handle worklet messages - loop the buffer
            audioWorkletNode.port.onmessage = async (e) => {
              if (e.data.type === "needsData" && isPlaying) {
                // Send the same buffer again to loop
                audioWorkletNode.port.postMessage({
                  type: "audio",
                  samples: audioBuffer,
                });
              }
            };

            // Send initial buffer
            audioWorkletNode.port.postMessage({
              type: "audio",
              samples: audioBuffer,
            });

            // Pre-send buffer again for seamless loop
            audioWorkletNode.port.postMessage({
              type: "audio",
              samples: audioBuffer,
            });

            isPlaying = true;
            playBtn.style.display = "none";
            stopBtn.style.display = "inline-block";
            playBtn.disabled = false;
            playBtn.textContent = "▶ Play (Infinite)";

            // Update time display
            const startTime = Date.now();
            const updateTime = () => {
              if (isPlaying) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                timeDisplay.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;
                requestAnimationFrame(updateTime);
              }
            };
            updateTime();
          } catch (error) {
            let errorMsg = "Unknown error";
            if (error?.message) errorMsg = error.message;
            else if (typeof error === "string") errorMsg = error;

            statusEl.innerHTML = `<mark>Error starting playback: ${errorMsg}</mark>`;
            outputEl.textContent = `Error: ${errorMsg}\n${error?.stack || ""}`;
            playBtn.disabled = false;
            playBtn.textContent = "▶ Play (Infinite)";
            isPlaying = false;
          }
        });

        // Stop button handler
        stopBtn.addEventListener("click", () => {
          isPlaying = false;

          if (audioWorkletNode) {
            audioWorkletNode.port.postMessage({ type: "stop" });
            audioWorkletNode.disconnect();
            audioWorkletNode = null;
          }

          playBtn.style.display = "inline-block";
          stopBtn.style.display = "none";
          timeDisplay.textContent = "";
        });
      } catch (error) {
        statusEl.removeAttribute("aria-busy");
        statusEl.innerHTML = `<mark>Error loading WebAssembly module: ${error.message}</mark>`;
      }
    </script>
